
<!-- ================= A — ATENÇÃO ================= -->
<section class="hero">
  <div class="fxl" aria-hidden="true">
    <i class="aur a1"></i><i class="aur a2"></i><i class="aur a3"></i>
  </div>
  <div class="wrap">
    <div class="rv">
      <span class="eyebrow">{{tema.hero_eyebrow}}</span>
      <h1>{{tema.hero_titulo}} <span class="script gold">{{tema.hero_destaque}}</span></h1>
      <p class="sub">{{tema.hero_sub}}</p>
      <div class="quick" id="heroCta">
        <a class="btn btn-gold q-go" href="pedido.html" data-cta="hero">{{tema.hero_cta}} <span aria-hidden="true">→</span></a>
      </div>
      <div class="micro"><span>{{tema.micro1}}</span><span>{{tema.micro2}}</span><span>{{tema.micro3}}</span></div>
    </div>
    <div class="hero-visual">
      <div class="core" aria-hidden="true">
        <i class="wave"></i><i class="wave w2"></i><i class="wave w3"></i>
        <i class="orbit" style="--d:16s;--dir:normal;--r:.58"><b></b></i>
        <i class="orbit" style="--d:23s;--dir:reverse;--r:.68"><b class="gold"></b></i>
        <i class="orbit" style="--d:38s;--dir:reverse;--r:.82"><b></b></i>
      </div>
      <div class="ring r2"></div><div class="ring r1"></div><div class="ring r3"></div><div class="halo"></div>
      <div class="hero-free" id="heroPhoto"><span class="hero-emoji" aria-hidden="true">{{tema.hero_emoji}}</span></div>
      <div class="hero-badge hb1"><b>{{tema.badge1_b}}</b>{{tema.badge1_t}}</div>
      <div class="hero-badge hb2"><b>{{tema.badge2_b}}</b>{{tema.badge2_t}}</div>
    </div>
  </div>
</section>
