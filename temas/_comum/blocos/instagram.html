
<!-- ================= INSTAGRAM ================= -->
<section class="insta" id="instagram">
  <div class="wrap">
    <div class="center" style="margin-bottom:28px"><span class="eyebrow">No Instagram</span><h2 class="rv">Acompanhe <span class="gold">{{loja.nome}}</span> de perto</h2><p class="lead rv">Novidades, bastidores e promoções primeiro no nosso perfil.</p></div>
    <div class="insta-head rv">
      <a class="insta-profile" href="{{loja.instagram_url}}" target="_blank" rel="noopener">
        <span class="insta-ring"><img id="instaAvatar" src="{{loja.logo}}" alt="" width="64" height="64"></span>
        <span><b>{{loja.instagram}}</b><small id="instaBio">{{tema.insta_bio}}</small></span>
      </a>
      <a class="btn btn-ghost" href="{{loja.instagram_url}}" target="_blank" rel="noopener">Seguir no Instagram</a>
    </div>
    <div class="insta-grid" id="instaGrid"></div>
  </div>
</section>
